[package]
name = "discrete-wave-hstar"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "discrete-wave-hstar"
path = "src/main.rs"

[dependencies]
arrow = "53"
anyhow = "1"
parquet = { version = "53", default-features = false, features = ["arrow", "snap", "zstd"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
chrono-tz = "0.8"
plotters = { version = "0.3", default-features = false, features = ["bitmap_backend", "bitmap_encoder", "svg_backend", "line_series", "ttf"] }
rand = "0.8"
statrs = "0.16"
fs2 = "0.4"
nalgebra = "0.32"
ndarray = "0.15"
csv = "1"
env_logger = "0.10"
rmp-serde = "1"

[dev-dependencies]
tempfile = "3"